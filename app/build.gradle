plugins {
    id 'com.android.application'
}

android {
    namespace 'com.riddle.diary'
    compileSdk 34
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.riddle.diary"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile rootProject.file('release.keystore')
            storePassword project.findProperty('RIDDLE_STOREPASS')
            keyAlias 'riddle'
            keyPassword project.findProperty('RIDDLE_STOREPASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
